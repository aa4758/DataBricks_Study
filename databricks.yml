# This is a Declarative Automation Bundle definition for databricks_study_demo.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_study_demo
  uuid: f76d89e4-b3b8-4738-8c0c-233da580bb05

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-fa52e44d-6801.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-fa52e44d-6801.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/83da4470-c5bf-43e6-aa98-8b967362c072 to make sure we only have a single copy.
      root_path: /Workspace/Users/83da4470-c5bf-43e6-aa98-8b967362c072/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - service_principal_name: 83da4470-c5bf-43e6-aa98-8b967362c072
        level: CAN_MANAGE
